<!DOCTYPE html>
<html>

<head>
    <title>Nexus Staff</title>
    <meta charset="utf-8" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="..." />
    <link rel="stylesheet" type="text/css" href="../StyleSheets/Authentification.css">
    <link href="https://fonts.googleapis.com/css?family=Anton" rel="stylesheet">
</head>

<body>
    <main>
        <section>
            <h1>Nexus Staff</h1>
        </section>

        <form>
            <section>
                <label for="email">
                    <h2>Email Address</h2>
                </label>
                <input class="textStyle" type="email" id="email" name="email" placeholder="Enter your email" required>
            </section>

            <section>
                <label for="password">
                    <h2>Password</h2>
                </label>
                <input class="textStyle" type="password" id="password" name="password" placeholder="Enter your password" required>
            </section>

            <section>
                <button class="textButton" type="submit">
                    <h2>Continue</h2>
                </button>
            </section>
        </form>
    </main>
</body>

</html>
