<!--<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Staff - Attendees</title>
    <link rel="stylesheet" href="../StyleSheets/Attendees.css">
    <script src="../JavaScript/Attendees.js" defer></script>
</head>

<body>
    <main class="attendees-container">

        <header class="attendees-header">
            <h2>Attendees</h2>
            <button type="button" id="close-attendees">X</button>
        </header>

        <section class="registered-section">

            <h3 id="registered-title">
                Registered attendees (0/20)
            </h3>

            <section class="progress-background">
                <div class="progress-fill" id="progress-fill"></div>
            </section>

            <table class="attendees-table">

                <thead>
                    <tr>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="attendees-list">

                </tbody>

            </table>

        </section>

    </main>

    POPUP FOR PARTICIPANT DELETION

    <section class="delete-attendee-background" id="delete-attendee-popup">

        <section class="delete-attendee-popup">

            <header class="delete-attendee-header">

                <img src="../Images/alertTriangle.svg" alt="Warning">

                <h2>Remove participant?</h2>

            </header>

            <section class="delete-attendee-content">

                <p class="delete-attendee-question" id="delete-attendee-question">
                    Are you sure you want to remove this participant?
                </p>

                <p class="delete-attendee-description">
                    This action will cancel their reservation and
                    free up 1 slot for this session.
                </p>

            </section>

            <section class="delete-attendee-buttons">

                <button type="button" class="cancel-button" id="cancel-remove-attendee">
                    Cancel
                </button>

                <button type="button" class="remove-button" id="confirm-remove-attendee">
                    Yes, Remove
                </button>

            </section>

            <p id="delete-attendee-error"></p>

        </section>

    </section>

</body>

</html>
