    <div class="pop_up_background">
        <div class="pop_up_new_workshop">

            <section class="create_workshop_header">
                <h2>Create New Workshop</h2>
                <button type="button">X</button>
            </section>

            <form>
                <section class="champ">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name">
                </section>

                <section class="champ">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="mangas">Mangas</option>
                        <option value="dessin">Dessin</option>
                        <option value="dedicace">Dédicace</option>
                        <option value="mystery">Mystery</option>
                    </select>
                </section>

                <section class="champ">
                    <label for="capacity">Max Capacity</label>
                    <input type="number" id="capacity" name="capacity" value="20">
                </section>

                <section class="ligne_date">
                    <section class="champ">
                        <label for="date">Date</label>
                        <input type="date" id="date" name="date" value="2026-10-12">
                    </section>

                    <section class="hour_line">
                        <section class="champ">
                            <label for="start">Start Time</label>
                            <input id="start" type="time" name="start" value="10:00" step="1800" required>
                        </section>
                        <section class="champ">
                            <label for="end">End Time</label>
                            <input id="end" type="time" name="end" value="11:30" step="1800" required>
                        </section>
                    </section>
                </section>

                <section class="champ">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </section>

                <section class="boutons">
                    <button type="button" class="cancel">Cancel</button>
                    <button type="submit" class="save">Save</button>
                </section>
            </form>

        </div>
    </div>
</body>

</html>
