<!DOCTYPE html>
<html>

<head>
    <title> Nexus Staff Portal - Workshops Master List</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="..." />
    <link rel="stylesheet" href="../StyleSheets/WorkshopsMasterList.css" />
    <script src="../JavaScript/WorkshopsMasterList.js" defer></script>
</head>

<body>
    <header>
        <h1 class="header-title">NEXUS STAFF PORTAL</h1>
    </header>

    <main class="main-background">

        <section class="workshops-section">
            <section class="subheader-section">
                <h2 class="subheader-child">Workshops</h2>
                <button id="add-workshop-button" class="add" type="button">Add New Workshop</button>
            </section>

            <table class="table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Category</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Capacity</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Intro to Manga Drawing</td>
                        <td>Manga</td>
                        <td>10:00</td>
                        <td>11:30</td>
                        <td>
                            <div class="capacity-container">
                                <div class="capacity-number">
                                    25/30
                                </div>
                                <span class="status-badge open">Open</span>
                            </div>
                        </td>
                        <td>
                            <div class="icon-button-container">
                                <button class="icon-button edit-button" type="button">
                                    <img src="../Images/pencil.svg" alt="Pencil">
                                </button>
                                <button class="icon-button delete-button" type="button">
                                    <img src="../Images/trash.svg" alt="Trash">
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>Lightsaber Combat</td>
                        <td>Sci-Fi</td>
                        <td>10:00</td>
                        <td>11:30</td>
                        <td>
                            <div class="capacity-container">
                                <div class="capacity-number">
                                    20/20
                                </div>
                                <span class="status-badge full">Full</span>
                            </div>
                        </td>
                        <td>
                            <div class="icon-button-container">
                                <button class="icon-button edit-button" type="button">
                                    <img src="../Images/pencil.svg" alt="Pencil">
                                </button>
                                <button class="icon-button delete-button" type="button">
                                    <img src="../Images/trash.svg" alt="Trash">
                                </button>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>Pop Quiz: 90s Games</td>
                        <td>Gaming</td>
                        <td>14:00</td>
                        <td>15:00</td>
                        <td>
                            <div class="capacity-container">
                                <div class="capacity-number">
                                    25/40
                                </div>
                                <span class="status-badge open">Open</span>
                            </div>
                        </td>
                        <td>
                            <div class="icon-button-container">
                                <button class="icon-button edit-button" type="button">
                                    <img src="../Images/pencil.svg" alt="Pencil">
                                </button>
                                <button class="icon-button delete-button" type="button">
                                    <img src="../Images/trash.svg" alt="Trash">
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td>Cosplay Crafting: EVA Foam Basics</td>
                        <td>Cosplay</td>
                        <td>14:30</td>
                        <td>17:00</td>
                        <td>
                            <div class="capacity-container">
                                <div class="capacity-number">
                                    4/12
                                </div>
                                <span class="status-badge open">Open</span>
                            </div>
                        </td>
                        <td>
                            <div class="icon-button-container">
                                <button class="icon-button edit-button" type="button">
                                    <img src="../Images/pencil.svg" alt="Pencil">
                                </button>
                                <button class="icon-button delete-button" type="button">
                                    <img src="../Images/trash.svg" alt="Trash">
                                </button>
                            </div>
                        </td>
                    </tr>

                </tbody>
            </table>


        </section>



    </main>
</body>

</html>
